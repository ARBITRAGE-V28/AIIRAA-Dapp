<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // System Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&family=JetBrains+Mono:wght=400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    
    <style>
        /* Container overgang-effecten */
        #terminal-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            filter: blur(15px);
            pointer-events: none;
            opacity: 0.5;
            transition: filter 0.8s ease, opacity 0.8s ease;
        }

        #terminal-container.active {
            filter: blur(0px);
            pointer-events: auto;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="terminal-container"></div>

    <div id="control-overlay">
        <div id="control-container" class="control-wrapper bot-control-root"></div>
    </div>

   <script type="module">
        import { terminalHTML, startTerminal } from "/src/terminal/terminalUI.js";
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        // Injecteer de schone HTML structuur van de terminal
        document.getElementById("terminal-container").innerHTML = terminalHTML;

        // Supabase initialisatie
        window.supabaseClient = createClient(
            "https://iglcfvgnwtlppweqdhwz.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnbGNmdmdud3RscHB3ZXFkaHd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDI1MTAsImV4cCI6MjA5MTkxODUxMH0.EzMscumlZ1I_fm1vXhDAhReMg2iuB2NrqII4B05r3DA"
        );

        // Transitiefuncties van overlay naar terminal en vice versa
        window.transitionToTerminal = function() {
            document.getElementById("control-overlay").style.display = "none";
            document.getElementById("terminal-container").classList.add("active");
            window.currentTerminalIntervals = startTerminal();
        };

        window.transitionToControl = function() {
            if (window.currentTerminalIntervals && window.currentTerminalIntervals.length > 0) {
                window.currentTerminalIntervals.forEach(clearInterval);
                window.currentTerminalIntervals = [];
                console.log("AURA Core: Terminal background threads terminated successfully.");
            }

            document.getElementById("control-overlay").style.display = "block";
            document.getElementById("terminal-container").classList.remove("active");
            
            if (typeof window.disconnectWallet === 'function') {
                window.disconnectWallet();
            }
        };
    </script>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
